<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Petrogen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Archivo:wght@300;400;500;700;800;900&family=Manrope:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="images/petrogen_logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<script src="header.js"></script>

<!-- PAGE BANNER -->
<section class="page-hero">
  <img class="page-hero-bg" src="images/contact-banner.jpeg" alt="" onerror="this.onerror=null;this.src='https://picsum.photos/seed/petrogen-contact-banner/1920/700'">
  <div class="hero-overlay"></div>
  <div class="wrapper page-hero-content">
    <span class="eyebrow" data-en="Get In Touch" data-ar="تواصل معنا">Get In Touch</span>
    <h1 data-en="Contact Us" data-ar="اتصل بنا">Contact Us</h1>
    <div class="breadcrumb">
      <a href="index.html" data-en="Home" data-ar="الرئيسية">Home</a> /
      <span data-en="Contact" data-ar="اتصل بنا">Contact</span>
    </div>
  </div>
</section>

<!-- CONTACT INFO + FORM -->
<section class="section">
  <div class="wrapper contact-grid">

    <div class="contact-info reveal reveal-left">
      <span class="eyebrow" data-en="Contact Information" data-ar="معلومات التواصل">Contact Information</span>
      <h2 data-en="We'd love to hear from you" data-ar="يسعدنا التواصل معك">We'd love to hear from you</h2>

      <div class="contact-info-item" style="margin-top:30px">
        <div class="contact-info-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8.1 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.9 2.2z"/></svg></div>
        <div>
          <h4 data-en="Call Us" data-ar="اتصل بنا">Call Us</h4>
          <p>920 022 563</p>
        </div>
      </div>
      <div class="contact-info-item">
        <div class="contact-info-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg></div>
        <div>
          <h4 data-en="Email Us" data-ar="راسلنا">Email Us</h4>
          <p>crm@petrogen.sa</p>
        </div>
      </div>
      <div class="contact-info-item">
        <div class="contact-info-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
        <div>
          <h4 data-en="Head Office" data-ar="المكتب الرئيسي">Head Office</h4>
          <p data-en="Petrogen Head Office, Riyadh, Saudi Arabia" data-ar="المكتب الرئيسي لبتروجين، الرياض، المملكة العربية السعودية">Petrogen Head Office, Riyadh, Saudi Arabia</p>
        </div>
      </div>

      <div class="map-box reveal">
        <iframe src="https://www.google.com/maps?q=24.7863128,46.7910144&output=embed" loading="lazy" title="Petrogen Head Office location map"></iframe>
      </div>
      <a class="station-directions" style="margin-top:14px;border-top:none;padding-top:0" href="https://www.google.com/maps/search/?api=1&query=24.7863128,46.7910144" target="_blank" rel="noopener">
        <span data-en="Open in Google Maps" data-ar="فتح في خرائط جوجل">Open in Google Maps</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>

    <div class="contact-form-wrap reveal reveal-right">
      <div class="contact-form">
        <h3 style="margin-bottom:20px" data-en="Send a Message" data-ar="أرسل رسالة">Send a Message</h3>
        <form id="contactForm">
          <div class="form-row">
            <div class="form-group">
              <label data-en="Full Name" data-ar="الاسم الكامل">Full Name</label>
              <input type="text" required placeholder="John Doe">
            </div>
            <div class="form-group">
              <label data-en="Phone" data-ar="رقم الجوال">Phone</label>
              <input type="tel" required placeholder="05xxxxxxxx">
            </div>
          </div>
          <div class="form-group">
            <label data-en="Email" data-ar="البريد الإلكتروني">Email</label>
            <input type="email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label data-en="Message" data-ar="رسالتك">Message</label>
            <textarea required placeholder="Write your message here..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-en="Send Message" data-ar="إرسال الرسالة">Send Message</button>
        </form>
      </div>
    </div>

  </div>
</section>

<script src="footer.js"></script>
<script src="script.js"></script>
</body>
</html>
